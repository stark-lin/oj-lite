<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Workspace</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <link rel="stylesheet" href="/assets/pages/admin.css" />
</head>
<body class="dashboard-page admin-page" data-app-title="Admin Workspace">
  <div class="app">
    <main class="workspace" id="workspace">
      <section class="column column--nav">
        <div class="panel-header">
          <div class="panel-title">Modules</div>
          <div class="header-actions">
            <span class="pane-meta">2 entries</span>
          </div>
        </div>
        <div class="column__body">
          <div class="stack" id="navList"></div>
        </div>
      </section>

      <div class="resizer resizer--vertical" data-resizer="1"></div>

      <section class="column column--list">
        <div class="panel-header">
          <div class="panel-title" id="listTitle">List</div>
          <div class="header-actions" id="listHeaderActions"></div>
        </div>
        <div class="column__body">
          <div class="toolbar-row" id="listToolbar"></div>
          <div class="stack" id="entityList"></div>
        </div>
      </section>

      <div class="resizer resizer--vertical" data-resizer="2"></div>

      <section class="column column--detail">
        <div class="panel-header">
          <div class="panel-title" id="detailTitle">Detail</div>
          <div class="pane-meta" id="detailMeta">No selection</div>
        </div>
        <div class="column__body" id="detailBody"></div>
      </section>
    </main>

    <footer class="statusbar">
      <div class="statusbar__left">
        <span class="status-pill">Admin</span>
        <span class="status-pill" id="statusMiddle">Teacher management</span>
      </div>
      <div class="statusbar__right">
        <span class="status-pill" id="statusRight">Ready</span>
      </div>
    </footer>
  </div>

  <script src="/assets/app.js"></script>
  <script src="/assets/components.js"></script>
  <script src="/assets/admin.js"></script>
</body>
</html>
