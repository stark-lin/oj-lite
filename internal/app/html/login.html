<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <link rel="stylesheet" href="/assets/pages/login.css" />
</head>
<body class="login-page" data-app-title="Login">
  <main class="auth">
    <div class="auth__brand" data-app-name hidden></div>
    <div class="surface card">
      <form class="form" id="loginForm">
        <div id="loginFieldsMount"></div>
        <button class="submit primary" type="submit" id="submitBtn">Sign in</button>
      </form>
    </div>

    <div class="notice" id="notice"></div>
  </main>

  <script src="/assets/app.js"></script>
  <script src="/assets/components.js"></script>
  <script src="/assets/login.js"></script>
</body>
</html>
