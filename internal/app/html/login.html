<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      overflow: auto;
    }

    .auth {
      width: 100%;
      max-width: 320px;
      display: grid;
      gap: 14px;
    }

    .auth__brand {
      text-align: center;
      font-size: 20px;
      line-height: 1.3;
      letter-spacing: 0.01em;
      color: var(--text);
      font-weight: var(--weight-semibold);
    }

    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-1);
      padding: 18px 20px;
    }

    .form {
      display: grid;
      gap: 16px;
    }

    .submit {
      width: 100%;
      height: 32px;
      font-weight: var(--weight-semibold);
    }

    .notice {
      min-height: 18px;
      padding: 0 4px;
      font-size: var(--text-sm);
      line-height: var(--lh-base);
      color: var(--text-faint);
      text-align: center;
    }

    .notice--error { color: var(--error); }
  </style>
</head>
<body data-app-title="Login">
  <main class="auth">
    <div class="auth__brand" data-app-name hidden></div>
    <div class="card">
      <form class="form" id="loginForm">
        <div id="loginFieldsMount"></div>
        <button class="submit primary" type="submit" id="submitBtn">Sign in</button>
      </form>
    </div>

    <div class="notice" id="notice"></div>
  </main>

  <script src="/assets/app.js"></script>
  <script src="/assets/login.js"></script>
</body>
</html>
