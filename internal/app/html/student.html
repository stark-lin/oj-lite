<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Workspace</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <link rel="stylesheet" href="/assets/pages/student.css" />
</head>
<body class="student-page" data-app-title="Student Workspace">
  <div class="app">
    <div class="workspace" id="workspace">
      <aside class="sidebar">
        <div class="panel-header sidebar-header">
          <div class="panel-title" id="lessonContextTitle">Current Lesson</div>
        </div>
        <div class="problem-list" id="problemList"></div>
      </aside>

      <div class="resizer resizer--vertical" id="sidebarSplitter" aria-hidden="true"></div>

      <main class="main" id="mainArea">
        <section class="editor-shell" id="editorShell">
          <section class="problem-pane">
            <div class="panel-header problem-pane__header">
              <div class="panel-title">Problem</div>
              <div class="pane-meta" id="problemStateText">Ready</div>
            </div>
            <div class="problem-content" id="problemContent"></div>
          </section>

          <div class="resizer resizer--vertical" id="problemSplitter" aria-hidden="true"></div>

          <section class="editor-pane">
            <div class="panel-header editor-pane__header">
              <div class="panel-title">Editor</div>
              <div class="editor-pane__controls">
                <span class="pane-meta" id="modifiedLabel">Saved</span>
                <button id="resetBtn" type="button">Reset</button>
                <button class="primary" id="submitBtn" type="button">Submit</button>
              </div>
            </div>
            <div class="editor-surface">
              <div class="editor-gutter" id="editorGutter" aria-hidden="true"></div>
              <div class="editor-stack">
                <pre class="editor-highlight" id="editorHighlightWrap" aria-hidden="true"><code id="editorHighlight"></code></pre>
                <textarea id="editor" class="editor" spellcheck="false"></textarea>
              </div>
            </div>
          </section>
        </section>

        <div class="resizer resizer--horizontal" id="resultSplitter" aria-hidden="true"></div>

        <section class="result-pane">
          <div class="panel-header result-pane__header">
            <div class="panel-title">Result</div>
            <div class="pane-meta" id="resultMeta">No submission yet</div>
          </div>
          <div class="result-content">
            <div class="result-section">
              <div id="judgeReportBlock"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <footer class="statusbar">
      <div class="statusbar__left">
        <span class="status-pill" id="statusLeft">Ready</span>
        <span class="status-pill" id="statusMiddle">Problem 1 / 3</span>
      </div>
      <div class="statusbar__right">
        <span class="status-pill" id="studentName">Student: —</span>
        <span class="status-pill" id="statusRight">Lua · UTF-8</span>
      </div>
    </footer>
  </div>

  <script src="/assets/vendor/marked.min.js"></script>
  <script src="/assets/vendor/purify.min.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/components.js"></script>
  <script src="/assets/student.js"></script>
</body>
</html>
