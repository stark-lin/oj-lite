<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Workspace</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <link rel="stylesheet" href="/assets/pages/teacher.css" />
</head>
<body class="dashboard-page teacher-page" data-app-title="Teacher Workspace">
  <div class="app">
    <main class="workspace" id="workspace">
      <section class="column column--classes">
        <div class="panel-header">
          <div class="panel-title">Classes</div>
          <div class="header-actions">
            <span class="pane-meta" id="classCountMeta"></span>
            <button class="action-button" id="createClassBtn" type="button">Create Class</button>
          </div>
        </div>
        <div class="column__body">
          <div class="stack" id="classList"></div>
        </div>
      </section>

      <div class="resizer resizer--vertical" data-resizer="1" title="Drag to resize columns"></div>

      <section class="column column--scope">
        <div class="panel-header">
          <div class="panel-title">Class Scope</div>
          <div class="header-actions">
            <span class="pane-meta" id="scopeMeta"></span>
            <button class="action-button" id="deleteClassBtn" type="button" disabled>Delete Class</button>
          </div>
        </div>
        <div class="column__body column__body--scope scroll-frame">
          <div id="studentManagementEntryMount"></div>
          <section id="lessonScopeMount"></section>
        </div>
      </section>

      <div class="resizer resizer--vertical" data-resizer="2" title="Drag to resize columns"></div>

      <section class="column column--browser">
        <div class="panel-header">
          <div class="panel-title" id="browserColumnTitle">Questions</div>
          <div class="header-actions">
            <span class="pane-meta" id="browserMeta"></span>
          </div>
        </div>
        <div class="column__body">
          <div class="stack" id="browserList"></div>
        </div>
      </section>

      <div class="resizer resizer--vertical" data-resizer="3" title="Drag to resize columns"></div>

      <section class="column column--detail">
        <div class="panel-header">
          <div class="panel-title" id="detailTitle"></div>
          <div class="pane-meta" id="detailMeta"></div>
        </div>
        <div class="column__body scroll-frame" id="detailBody"></div>
      </section>
    </main>

    <footer class="statusbar">
      <div class="statusbar__left">
        <span class="status-pill" id="statusLeft"></span>
        <span class="status-pill" id="statusMiddle"></span>
      </div>
      <div class="statusbar__right">
        <span class="status-pill" id="teacherName">Teacher: —</span>
        <span class="status-pill" id="statusRight"></span>
      </div>
    </footer>
  </div>

  <script src="/assets/vendor/marked.min.js"></script>
  <script src="/assets/vendor/purify.min.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/components.js"></script>
  <script src="/assets/teacher.js"></script>
</body>
</html>
